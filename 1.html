<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thư viện ảnh: Top Truyện Tu Tiên</title>
    <link rel="stylesheet" href="1.css" />
    <script src="1.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Thư viện ảnh: Top Truyện Tu Tiên Hay Nhất</h1>
    </header>

    <main>
      <div id="image-container" class="main-image-display">
        Di chuột qua hoặc dùng phím Tab vào ảnh bên dưới để xem chi tiết bộ
        truyện.
      </div>

      <div class="thumbnail-container">
        <img
          src="pham_nhan_tu_tien.png"
          alt="Phàm Nhân Tu Tiên - Hàn Lập"
          class="preview"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          src="dau_pha_thuong_khung.png"
          alt="Đấu Phá Thương Khung - Tiêu Viêm"
          class="preview"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          src="the-gioi-hoan-my-movie-cuu-kiep-phan-thien-thumb-1.webp"
          alt="Thế Giới Hoàn Mỹ - Thạch Hạo"
          class="preview"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          src="tien_nghich.png"
          alt="Tiên Nghịch - Vương Lâm"
          class="preview"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          src="gia_thien.png"
          alt="Già Thiên - Diệp Phàm"
          class="preview"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />

        <img
          src="muc_than_ky.png"
          alt="Mục Thần Ký"
          class="preview"
          onmouseover="upDate(this)"
          onmouseleave="unDo()"
          onfocus="upDate(this)"
          onblur="unDo()"
        />
      </div>
    </main>
  </body>
</html>
